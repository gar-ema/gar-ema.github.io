<!-- Light/dark theme toggle button + transparency note about local storage use. -->
<button id="theme-toggle" type="button" aria-pressed="false" title="Cambia tema chiaro/scuro">
  <span aria-hidden="true" class="theme-toggle-icon">&#9680;</span>
  <span class="visually-hidden">Cambia tema chiaro/scuro</span>
</button>

<p class="theme-toggle-note">
  La preferenza di tema (chiaro/scuro) viene salvata solo nel tuo browser (localStorage), un dato tecnico
  necessario per ricordare la tua scelta. Non è un cookie, non è condiviso con terzi e non serve per profilazione.
</p>

<style>
  #theme-toggle {
    position: fixed;
    bottom: 0.75em;
    right: 0.75em;
    z-index: 20;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
    width: 2.25em;
    height: 2.25em;
    line-height: 1;
    background: rgba(128, 128, 128, 0.2);
    border: 1px solid currentColor;
    border-radius: 50%;
    cursor: pointer;
    color: inherit;
    font-size: 1em;
  }

  .theme-toggle-note {
    max-width: 40em;
    margin: 0 auto 1em;
    padding: 0 1em;
    font-size: 0.75em;
    opacity: 0.65;
    text-align: center;
  }
</style>

<script>
  (function () {
    var btn = document.getElementById('theme-toggle');
    var darkCss = document.getElementById('theme-css-dark');
    var lightCss = document.getElementById('theme-css-light');
    if (!btn || !darkCss || !lightCss) return;

    function currentTheme() {
      return document.documentElement.getAttribute('data-theme') || 'dark';
    }

    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      darkCss.disabled = theme === 'light';
      lightCss.disabled = theme === 'dark';
      btn.setAttribute('aria-pressed', theme === 'light');
    }

    applyTheme(currentTheme());

    btn.addEventListener('click', function () {
      var next = currentTheme() === 'light' ? 'dark' : 'light';
      applyTheme(next);
      try { localStorage.setItem('theme', next); } catch (e) {}
    });
  })();
</script>
