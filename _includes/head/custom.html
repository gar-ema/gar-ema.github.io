<!-- Light/dark theme: two pre-built stylesheets, toggled client-side and
     remembered in localStorage. No cookies, no third-party libraries. -->
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}" id="theme-css-dark">
<link rel="stylesheet" href="{{ '/assets/css/main-light.css' | relative_url }}" id="theme-css-light">
<script>
  (function () {
    var stored = null;
    try { stored = localStorage.getItem('theme'); } catch (e) {}
    var prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
    var theme = stored || (prefersLight ? 'light' : 'dark');
    document.documentElement.setAttribute('data-theme', theme);
    document.getElementById(theme === 'light' ? 'theme-css-dark' : 'theme-css-light').disabled = true;
  })();
</script>
