- title: "APIOps in azione: aggiungiamo agilità e governance alle tue API su Azure"
  event: "#4Dev 2026"
  date: "2026-10-16"
  description: >
    Le API sono il cuore pulsante dei nostri ecosistemi digitali. In questa
    sessione esploreremo come l'approccio APIOps possa trasformare la gestione
    delle API quando vengono deployate su Azure. Discuteremo di come APIOps riduca
    i rischi operativi e acceleri il rilascio delle API, garantendo al contempo
    conformità tra gli ambienti e tracciabilità. Approfondiremo come questo
    modello favorisca una cultura di collaborazione tra team, promuovendo
    l'autonomia operativa e il rispetto degli standard di qualità in tutti gli
    ambienti.
  event_url: "https://sharp4dev.sharpcoding.it/"
  talk_url:
  slides_url:
  demo_url:

- title: "Quanto costa un token? FinOps per l'AI in produzione"
  event: "1nn0vAI 2026"
  date: "2026-09-26"
  description: >
    Il POC costa poco, poi si arriva in produzione e il conto dell'AI diventa la
    voce che nessuno sa spiegare. Il motivo quasi sempre è uno: i token. Prompt
    gonfi, contesto che cresce, RAG che recupera troppo, agenti che ciclano,
    output prolissi, retry. Ogni chiamata è un costo, e a fine mese la somma è
    una sorpresa. FinOps entra fin dentro l'AI generativa partendo dall'unità che
    conta davvero, il token. Vediamo dove si bruciano i token, come misurare il
    costo per richiesta e soprattutto per risultato utile, e quali leve lo
    spostano. Gli esempi saranno vendor-neutral, varranno con OpenAI, Anthropic o
    altri e, anche se calati su Microsoft Foundry, saranno comodi anche al di fuori.
  event_url: "https://1nn0vai2026.1nn0va.it/"
  talk_url: "https://1nn0vai2026.1nn0va.it/#schedule"
  slides_url: "/talks/1nn0vai-2026/2026-09-26-1nn0vAI-quanto-costa-un-token-v7.pdf"
  demo_url:

- title: "Ai ai ai, hai provato a fare tutto con l'AI?"
  event: "TabIA Conf 2026 — Tech Day"
  date: "2026-05-29"
  description: >
    Hai provato il vibe coding: prompt, codice generato, tutto magico per venti minuti.
    Poi il progetto cresce, il contesto si perde, e ti ritrovi a non capire più il codice
    che l'AI ha scritto per te. In questo talk ripercorro l'evoluzione dello sviluppo
    software con l'AI: dal vibe coding allo spec-driven (specifica prima, codice dopo),
    fino a una valutazione onesta delle metodologie più recenti (TDD assistito da AI,
    sistemi multi-agente, loop di auto-revisione). Capire la differenza ci aiuta a
    orientarci sulla mappa di un territorio in continuo mutamento, sfatare i miti del
    nostro tempo ed essere pronti a trarne il meglio.
  event_url: "https://tabiaconf.it/#programma"
  slides_url:
  demo_url:

- title: "Intro al Cost Management su Azure col Well-Architected Framework"
  event: "Global Azure 2026 Pordenone"
  date: "2026-04-18"
  description: >
    Capita a tutti di aprire il portale Azure e trovare i costi del mese diversi
    dalle previsioni. Partiamo dai fondamentali del Cost Optimization Pillar del
    Well-Architected Framework, senza dare nulla per scontato, e vediamo insieme
    gli strumenti Azure pensati per chi inizia (Cost Management, Advisor e query
    per individuare risorse sottoutilizzate). Il cloud costa, oppure ottimizzandolo
    diventa competitivo rispetto al TCO? Scopriamolo insieme.
  event_url: "https://globalazure2026pn.1nn0va.it/"
  talk_url: "https://globalazure2026pn.1nn0va.it/#schedule"
  slides_url:
  demo_url:

- title: "Copilot, mostrami anomalie nei costi delle risorse"
  event: "1nn0vAI 2025"
  date: "2025-09-27"
  description: >
    Il vostro FinOps Practitioner vi ha aiutati a mettere in piedi gli strumenti
    per raccogliere dati su consumi e metriche di utilizzo delle risorse e scoprire
    come ottimizzare i costi del cloud. E se invece di imparare una nuova sintassi
    per interrogare quei dati parlassimo con Copilot? Vediamo un uso concreto di
    FinOps Hubs che, tramite Azure MCP server, si integra con GitHub Copilot per
    chiedere all'AI come ottimizzare i costi di tutto l'ambiente cloud; e grazie a
    FOCUS non ci limiteremo a un solo cloud provider.
  event_url: "https://1nn0vai2025.1nn0va.it/"
  talk_url: "https://1nn0vai2025.1nn0va.it/#schedule"
  slides_url:
  demo_url:

- title: "Azure Load Balancers demistified"
  event: "Infrastructure as a Saturday 2025"
  date: "2025-04-12"
  description: >
    In Azure sotto la categoria Load balancers ricadono diversi servizi. In questa
    sessione discutiamo le principali differenze tra Load Balancer, Application
    Gateway, Front Door e Traffic Manager, identificando per ognuno l'opportuno
    caso d'uso rispetto alle funzionalità messe a disposizione. Infine vediamo
    praticamente come implementare e gestire questi servizi in scenari reali,
    evidenziando l'efficacia di Azure nell'instradare il traffico in ingresso.
  event_url: "https://iaasat2025pn.1nn0va.it/"
  talk_url: "https://iaasat2025pn.1nn0va.it/#schedule"
  slides_url:
  demo_url:




