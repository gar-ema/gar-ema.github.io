remote_theme: mmistakes/minimal-mistakes
minimal_mistakes_skin: "dark"

title: "Unhandled Exception"
subtitle: "Emanuele Garofalo — Solution Architect"
description: >-
  Profilo community di Emanuele Garofalo — Solution Architect.
  Talks, presentazioni e articoli tecnici su .NET, C# e architettura software.
url: "https://blog.unhandledexception.it"
baseurl: ""

locale: "it-IT"
timezone: Europe/Rome

# Author sidebar
author:
  name: "Emanuele Garofalo"
  bio: "Solution Architect · Community Speaker · DotNetCampania"
  location: "Italy"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/gar-ema"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/emanuelegarofalo/"
    - label: "Twitter"
      icon: "fab fa-fw fa-twitter"
      url: "https://twitter.com/gar_ema"

# Build
markdown: kramdown
highlighter: rouge

# Sass — silence deprecation warnings from Minimal Mistakes v4 / vendor SCSS
# (susy, breakpoint, @import — would require a full upstream rewrite to fix)
sass:
  silence_deprecations:
    - import
    - global-builtin
    - color-functions
    - if-function
    - slash-div

kramdown:
  input: GFM

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "single"
      author_profile: true
      read_time: false
      comments: false
  - scope:
      path: "_pages"
      type: "pages"
    values:
      layout: "single"
      author_profile: true

# Plugins
plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-include-cache

# Include
include:
  - _pages

# Exclude
exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - CLAUDE.md
  - LICENSE
  - "*.config.js"
  - package*.json
  - Gemfile
  - Gemfile.lock
  - script/
  - tests/
